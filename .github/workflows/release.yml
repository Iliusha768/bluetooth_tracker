name: Build and publish Windows release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build standalone app
        run: dotnet publish BatteryDock.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true
      - name: Check installer syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path install.ps1), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          $menu = @('4', 'no', '0') | powershell.exe -NoProfile -ExecutionPolicy RemoteSigned -File .\install.ps1 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0 -or $menu -notmatch 'Отменено') { throw "Cancellation check failed: $menu" }
      - name: Create archive and checksum
        shell: pwsh
        run: |
          $publish = 'bin/Release/net10.0-windows10.0.19041.0/win-x64/publish'
          Copy-Item install.ps1 "$publish/manage.ps1"
          Compress-Archive -Path "$publish/*" -DestinationPath BatteryDock-win-x64.zip
          (Get-FileHash BatteryDock-win-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant() |
            Set-Content -NoNewline -Encoding ascii BatteryDock-win-x64.zip.sha256
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v0.1.$env:GITHUB_RUN_NUMBER"
          gh release create $tag BatteryDock-win-x64.zip BatteryDock-win-x64.zip.sha256 `
            --target $env:GITHUB_SHA --title "BatteryDock $tag" --generate-notes
      - name: Check install, command and removal
        shell: pwsh
        run: |
          $installResult = @('1', 'no', 'yes', '0') | powershell.exe -NoProfile -ExecutionPolicy RemoteSigned -File .\install.ps1 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { throw "Installation failed: $installResult" }
          $app = Join-Path $env:LOCALAPPDATA 'BatteryDock/BatteryDock.exe'
          $command = Join-Path $env:LOCALAPPDATA 'BatteryDockCommand/bluetoothdock.cmd'
          if (-not (Test-Path $app) -or -not (Test-Path $command)) { throw 'Installed files are missing.' }
          $manageResult = @('3', 'yes', '0') | & $command 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0 -or $manageResult -notmatch 'Автозапуск включён') { throw "Management command failed: $manageResult" }
          $removeResult = @('4', 'yes') | & $command 2>&1 | Out-String
          $exitCode = $LASTEXITCODE
          $appRemains = Test-Path $app
          $commandRemains = Test-Path $command
          if ($exitCode -ne 0 -or $appRemains -or $commandRemains) {
            throw "Removal failed (exit=$exitCode, app=$appRemains, command=$commandRemains): $removeResult"
          }
